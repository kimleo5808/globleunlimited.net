<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover: how to recognize any country by its outline — stylised silhouettes of Italy, Chile and Japan on an atlas grid">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#15304d"/><stop offset="100%" stop-color="#0B1622"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g stroke="#F4C95D" stroke-opacity="0.07" fill="none">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#F4C95D" stroke-opacity="0.35"/>
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#F4C95D" stroke-opacity="0.15"/>
  <!-- Italy boot (stylised) -->
  <g transform="translate(120,120)">
    <path d="M60 0 L95 12 L88 45 L102 78 L140 118 L170 132 L166 155 L128 148 L96 118 L74 150 L88 178 L70 192 L52 168 L64 140 L52 96 L30 60 L38 22 Z"
          fill="#13243A" stroke="#F4C95D" stroke-width="2.5"/>
    <ellipse cx="30" cy="205" rx="26" ry="14" fill="#13243A" stroke="#F4C95D" stroke-width="2" transform="rotate(-20 30 205)"/>
    <ellipse cx="118" cy="215" rx="20" ry="12" fill="#13243A" stroke="#F4C95D" stroke-width="2"/>
    <text x="85" y="265" text-anchor="middle" font-family="'Space Mono',ui-monospace,monospace" font-size="16" fill="#9DB2C6">THE BOOT</text>
  </g>
  <!-- Chile ribbon (stylised) -->
  <g transform="translate(420,90)">
    <path d="M20 0 C34 40 24 90 34 140 C44 190 30 240 44 290 C50 312 40 330 28 336 C14 320 22 270 12 220 C2 170 16 120 6 70 C2 40 8 12 20 0 Z"
          fill="#13243A" stroke="#F4C95D" stroke-width="2.5"/>
    <text x="28" y="378" text-anchor="middle" font-family="'Space Mono',ui-monospace,monospace" font-size="16" fill="#9DB2C6">THE RIBBON</text>
  </g>
  <!-- Japan archipelago (stylised) -->
  <g transform="translate(540,140)">
    <ellipse cx="60" cy="30" rx="34" ry="16" fill="#13243A" stroke="#F4C95D" stroke-width="2.5" transform="rotate(38 60 30)"/>
    <path d="M78 66 C108 74 128 96 140 128 C130 142 108 138 92 120 C80 104 72 84 78 66 Z" fill="#13243A" stroke="#F4C95D" stroke-width="2.5"/>
    <ellipse cx="122" cy="168" rx="26" ry="13" fill="#13243A" stroke="#F4C95D" stroke-width="2.5" transform="rotate(28 122 168)"/>
    <ellipse cx="158" cy="200" rx="16" ry="9" fill="#13243A" stroke="#F4C95D" stroke-width="2" transform="rotate(24 158 200)"/>
    <text x="110" y="250" text-anchor="middle" font-family="'Space Mono',ui-monospace,monospace" font-size="16" fill="#9DB2C6">THE CHAIN</text>
  </g>
  <!-- headline -->
  <text x="560" y="450" font-family="'Space Mono',ui-monospace,monospace" font-size="20" letter-spacing="5" fill="#F4C95D">FIELD GUIDE</text>
  <text x="560" y="514" font-family="Georgia,'Times New Roman',serif" font-size="52" fill="#EAF2F8">Recognize Any Country</text>
  <text x="560" y="572" font-family="Georgia,'Times New Roman',serif" font-size="52" font-style="italic" fill="#F4C95D">by Its Outline</text>
  <text x="790" y="120" font-family="'Space Mono',ui-monospace,monospace" font-size="19" fill="#9DB2C6">7 shape families ·</text>
  <text x="790" y="148" font-family="'Space Mono',ui-monospace,monospace" font-size="19" fill="#9DB2C6">one scanning method</text>
  <g stroke="#F4C95D" stroke-opacity="0.6">
    <path d="M24 54V24H54M1146 24H1176V54M1176 576V606H1146M54 606H24V576" fill="none" stroke-width="2"/>
  </g>
</svg>
