    <circle cx="300" cy="205" r="7" fill="#F4C95D"/>
    <text x="300" y="182" text-anchor="middle" font-family="'Space Mono',ui-monospace,monospace" font-size="17" fill="#EAF2F8">UK</text>
    <circle cx="352" cy="380" r="56" fill="none" stroke="#E8743B" stroke-opacity="0.85" stroke-dasharray="5 5"/>
    <circle cx="352" cy="380" r="7" fill="#F4C95D"/>
    <text x="352" y="418" text-anchor="middle" font-family="'Space Mono',ui-monospace,monospace" font-size="17" fill="#EAF2F8">NIGERIA</text>
