  <text x="620" y="200" font-family="'Space Mono',ui-monospace,monospace" font-size="20" letter-spacing="5" fill="#F4C95D">FIELD NOTES · DATA STUDY</text>
  <text x="620" y="278" font-family="Georgia,'Times New Roman',serif" font-size="62" fill="#EAF2F8">The Best Globle</text>
  <text x="620" y="348" font-family="Georgia,'Times New Roman',serif" font-size="62" fill="#EAF2F8">Starting Country,</text>
  <text x="620" y="418" font-family="Georgia,'Times New Roman',serif" font-size="62" font-style="italic" fill="#F4C95D">According to Math</text>
  <text x="620" y="478" font-family="'Space Mono',ui-monospace,monospace" font-size="19" fill="#9DB2C6">176 countries · every pair measured · one surprising winner</text>
