<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover: the best Globle starting country, according to math">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#15304d"/><stop offset="100%" stop-color="#0B1622"/>
    </radialGradient>
    <radialGradient id="globe" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#1B3350"/><stop offset="100%" stop-color="#0E1C2E"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="330" cy="315" r="205"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- graticule background -->
  <g stroke="#F4C95D" stroke-opacity="0.07" fill="none">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>
  <!-- plate frame -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#F4C95D" stroke-opacity="0.35"/>
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#F4C95D" stroke-opacity="0.15"/>
  <!-- globe -->
  <circle cx="330" cy="315" r="205" fill="url(#globe)" stroke="#F4C95D" stroke-opacity="0.6" stroke-width="2"/>
  <g clip-path="url(#disc)" stroke="#F4C95D" stroke-opacity="0.28" fill="none">
    <ellipse cx="330" cy="315" rx="205" ry="70"/>
    <ellipse cx="330" cy="315" rx="205" ry="140"/>
    <ellipse cx="330" cy="315" rx="70" ry="205"/>
    <ellipse cx="330" cy="315" rx="140" ry="205"/>
