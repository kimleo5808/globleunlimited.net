<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Bar chart: mean distance from each country to all 175 others. Greece is most central at 5464 km; New Zealand least central at 13976 km.">
  <rect width="1000" height="560" fill="#0E1C2E"/>
  <rect x="16" y="16" width="968" height="528" fill="none" stroke="#F4C95D" stroke-opacity="0.3"/>
  <text x="50" y="62" font-family="Georgia,serif" font-size="27" fill="#EAF2F8">Centrality: mean distance to all 175 other countries</text>
  <text x="50" y="90" font-family="'Space Mono',ui-monospace,monospace" font-size="15" fill="#5E7891">PLATE 1 · lower = more central · km, great-circle</text>
  <!-- axis -->
  <g font-family="'Space Mono',ui-monospace,monospace" font-size="14" fill="#5E7891">
    <text x="240" y="130">0</text><text x="480" y="130">7,000</text><text x="740" y="130">14,000</text>
  </g>
  <path d="M245 140V505 M497 140V505 M749 140V505" stroke="#F4C95D" stroke-opacity="0.12"/>
  <!-- bars: x = 245 + km * 0.036 ; 5464→196.7, 5475→197.1, 5477, 5494, 5495 ; 12882→463.8, 13961→502.6, 13976→503.1 -->
  <g font-family="'Space Mono',ui-monospace,monospace" font-size="15">
    <g>
      <text x="235" y="170" text-anchor="end" fill="#EAF2F8">Greece</text>
      <rect x="245" y="155" width="197" height="20" fill="#FFEDA0"/>
      <text x="452" y="170" fill="#FFEDA0">5,464</text>
    </g>
    <g>
      <text x="235" y="205" text-anchor="end" fill="#EAF2F8">N. Macedonia</text>
      <rect x="245" y="190" width="197" height="20" fill="#FFEDA0" fill-opacity="0.85"/>
      <text x="452" y="205" fill="#FFEDA0">5,475</text>
    </g>
    <g>
      <text x="235" y="240" text-anchor="end" fill="#EAF2F8">Albania</text>
      <rect x="245" y="225" width="197" height="20" fill="#FFEDA0" fill-opacity="0.75"/>
      <text x="452" y="240" fill="#FFEDA0">5,477</text>
    </g>
    <g>
      <text x="235" y="275" text-anchor="end" fill="#EAF2F8">Montenegro</text>
      <rect x="245" y="260" width="198" height="20" fill="#FFEDA0" fill-opacity="0.65"/>
      <text x="453" y="275" fill="#FFEDA0">5,494</text>
    </g>
    <g>
      <text x="235" y="310" text-anchor="end" fill="#EAF2F8">Bulgaria</text>
      <rect x="245" y="295" width="198" height="20" fill="#FFEDA0" fill-opacity="0.55"/>
      <text x="453" y="310" fill="#FFEDA0">5,495</text>
    </g>
    <text x="500" y="352" fill="#5E7891" font-size="18">⋮  168 countries in between  ⋮</text>
    <g>
      <text x="235" y="395" text-anchor="end" fill="#EAF2F8">Solomon Is.</text>
      <rect x="245" y="380" width="464" height="20" fill="#C42D1C"/>
      <text x="719" y="395" fill="#E8743B">12,882</text>
    </g>
    <g>
      <text x="235" y="430" text-anchor="end" fill="#EAF2F8">Fiji</text>
      <rect x="245" y="415" width="503" height="20" fill="#A61505"/>
      <text x="758" y="430" fill="#E8743B">13,961</text>
    </g>
    <g>
      <text x="235" y="465" text-anchor="end" fill="#EAF2F8">New Zealand</text>
      <rect x="245" y="450" width="503" height="20" fill="#8B0000"/>
      <text x="758" y="465" fill="#E8743B">13,976</text>
    </g>
  </g>
  <text x="50" y="528" font-family="'Space Mono',ui-monospace,monospace" font-size="14" fill="#5E7891">Source: globleunlimited.net dataset, 176 countries, haversine on country centre points</text>
</svg>
