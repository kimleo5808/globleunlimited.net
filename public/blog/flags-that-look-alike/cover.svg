<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover: flags that look alike — the flags of Chad and Romania overlapping, nearly identical blue-yellow-red tricolours">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#15304d"/><stop offset="100%" stop-color="#0B1622"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g stroke="#F4C95D" stroke-opacity="0.07" fill="none">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#F4C95D" stroke-opacity="0.35"/>
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#F4C95D" stroke-opacity="0.15"/>
  <!-- Romania flag, tilted back -->
  <g transform="translate(150,150) rotate(-8)">
    <rect width="360" height="240" fill="#002B7F"/>
    <rect x="120" width="120" height="240" fill="#FCD116"/>
    <rect x="240" width="120" height="240" fill="#CE1126"/>
    <rect width="360" height="240" fill="none" stroke="#0B1622" stroke-width="3"/>
    <text x="14" y="228" font-family="'Space Mono',ui-monospace,monospace" font-size="19" fill="#EAF2F8" stroke="#0B1622" stroke-width="3" paint-order="stroke">ROMANIA</text>
  </g>
  <!-- Chad flag, overlapping front -->
  <g transform="translate(310,260) rotate(6)">
    <rect width="360" height="240" fill="#002664"/>
    <rect x="120" width="120" height="240" fill="#FECB00"/>
    <rect x="240" width="120" height="240" fill="#C60C30"/>
    <rect width="360" height="240" fill="none" stroke="#0B1622" stroke-width="3"/>
    <text x="14" y="228" font-family="'Space Mono',ui-monospace,monospace" font-size="19" fill="#EAF2F8" stroke="#0B1622" stroke-width="3" paint-order="stroke">CHAD</text>
  </g>
  <!-- magnifier on the blue stripes -->
  <g transform="translate(430,290)">
    <circle r="52" fill="none" stroke="#F4C95D" stroke-width="3"/>
    <path d="M38 38 L78 78" stroke="#F4C95D" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- headline -->
  <text x="760" y="200" font-family="'Space Mono',ui-monospace,monospace" font-size="20" letter-spacing="5" fill="#F4C95D">SPOTTER'S GUIDE</text>
  <text x="760" y="272" font-family="Georgia,'Times New Roman',serif" font-size="62" fill="#EAF2F8">Flags That</text>
  <text x="760" y="340" font-family="Georgia,'Times New Roman',serif" font-size="62" fill="#EAF2F8">Look Alike</text>
  <text x="760" y="404" font-family="Georgia,'Times New Roman',serif" font-size="35" font-style="italic" fill="#F4C95D">15 pairs, one tell each</text>
  <text x="760" y="458" font-family="'Space Mono',ui-monospace,monospace" font-size="19" fill="#9DB2C6">twins · mirrors · crosses ·</text>
  <text x="760" y="486" font-family="'Space Mono',ui-monospace,monospace" font-size="19" fill="#9DB2C6">colour families</text>
  <g stroke="#F4C95D" stroke-opacity="0.6">
    <path d="M24 54V24H54M1146 24H1176V54M1176 576V606H1146M54 606H24V576" fill="none" stroke-width="2"/>
  </g>
</svg>
