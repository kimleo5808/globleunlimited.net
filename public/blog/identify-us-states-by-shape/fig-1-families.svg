<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Four panels showing the shape families: rectangles, wedges and slabs, coastal irregulars, and one-offs.">
  <rect width="1000" height="560" fill="#0E1C2E"/>
  <rect x="16" y="16" width="968" height="528" fill="none" stroke="#F4C95D" stroke-opacity="0.3"/>
  <text x="50" y="62" font-family="Georgia,'Times New Roman',serif" font-size="27" fill="#EAF2F8">The four shape families</text>
  <text x="50" y="90" font-family="'Space Mono',ui-monospace,monospace" font-size="15" fill="#5E7891">PLATE 1 · sort first, identify second</text>
  <g>
    <rect x="60" y="140" width="200" height="230" fill="none" stroke="#F4C95D" stroke-opacity="0.25" rx="8"/>
    <g transform="translate(80,160)"><path d="M30 20h150v100h-150z" fill="#8B0000" fill-opacity="0.85" stroke="#F4C95D" stroke-opacity="0.6"/></g>
    <text x="160" y="320" text-anchor="middle" font-family="'Space Mono',ui-monospace,monospace" font-size="15" fill="#EAF2F8">Rectangles</text>
    <text x="160" y="348" text-anchor="middle" font-family="'Space Mono',ui-monospace,monospace" font-size="13" fill="#5E7891">CO WY UT KS NE ND SD</text>
  </g>
  <g>
    <rect x="290" y="140" width="200" height="230" fill="none" stroke="#F4C95D" stroke-opacity="0.25" rx="8"/>
    <g transform="translate(310,160)"><path d="M30 20h150l-24 100h-126z" fill="#C42D1C" fill-opacity="0.85" stroke="#F4C95D" stroke-opacity="0.6"/></g>
    <text x="390" y="320" text-anchor="middle" font-family="'Space Mono',ui-monospace,monospace" font-size="15" fill="#EAF2F8">Wedges &amp; slabs</text>
    <text x="390" y="348" text-anchor="middle" font-family="'Space Mono',ui-monospace,monospace" font-size="13" fill="#5E7891">NV ID MT OR WA</text>
  </g>
  <g>
    <rect x="520" y="140" width="200" height="230" fill="none" stroke="#F4C95D" stroke-opacity="0.25" rx="8"/>
    <g transform="translate(540,160)"><path d="M30 30q40 -18 70 6t80 -8v78q-50 22 -90 4t-60 10z" fill="#E8743B" fill-opacity="0.85" stroke="#F4C95D" stroke-opacity="0.6"/></g>
    <text x="620" y="320" text-anchor="middle" font-family="'Space Mono',ui-monospace,monospace" font-size="15" fill="#EAF2F8">Coastal irregulars</text>
    <text x="620" y="348" text-anchor="middle" font-family="'Space Mono',ui-monospace,monospace" font-size="13" fill="#5E7891">FL CA TX LA ME NC</text>
  </g>
  <g>
    <rect x="750" y="140" width="200" height="230" fill="none" stroke="#F4C95D" stroke-opacity="0.25" rx="8"/>
    <g transform="translate(770,160)"><path d="M30 20h60v40h30v-40h60v100h-150z" fill="#FEB24C" fill-opacity="0.85" stroke="#F4C95D" stroke-opacity="0.6"/></g>
    <text x="850" y="320" text-anchor="middle" font-family="'Space Mono',ui-monospace,monospace" font-size="15" fill="#EAF2F8">One-offs</text>
    <text x="850" y="348" text-anchor="middle" font-family="'Space Mono',ui-monospace,monospace" font-size="13" fill="#5E7891">MI LA OK WV AK HI</text>
  </g>
  <text x="500" y="425" text-anchor="middle" font-family="'Space Mono',ui-monospace,monospace" font-size="15" fill="#F4C95D">The simplest shapes carry the least information.</text>
  <text x="50" y="524" font-family="'Space Mono',ui-monospace,monospace" font-size="13" fill="#5E7891">Families are our classification, not a computed result.</text>
</svg>
