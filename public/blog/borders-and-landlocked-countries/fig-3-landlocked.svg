<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Bar chart: 16 landlocked countries in Africa, 12 in Asia, 10 in Europe, 2 in the Americas.">
  <rect width="1000" height="560" fill="#0E1C2E"/>
  <rect x="16" y="16" width="968" height="528" fill="none" stroke="#F4C95D" stroke-opacity="0.3"/>
  <text x="50" y="62" font-family="Georgia,'Times New Roman',serif" font-size="27" fill="#EAF2F8">40 landlocked countries, by region</text>
  <text x="50" y="90" font-family="'Space Mono',ui-monospace,monospace" font-size="15" fill="#5E7891">PLATE 3 · of the 176 in the pool — the world figure is 44 of 195</text>
  <g font-family="'Space Mono',ui-monospace,monospace" font-size="15">
    <text x="288" y="165" text-anchor="end" fill="#EAF2F8">Africa</text>
    <rect x="300" y="150" width="427" height="21" fill="#FEB24C"/>
    <text x="736.6666666666666" y="166" fill="#FEB24C">16</text>
  </g>
  <g font-family="'Space Mono',ui-monospace,monospace" font-size="15">
    <text x="288" y="227" text-anchor="end" fill="#EAF2F8">Asia</text>
    <rect x="300" y="212" width="320" height="21" fill="#E8743B"/>
    <text x="630" y="228" fill="#E8743B">12</text>
  </g>
  <g font-family="'Space Mono',ui-monospace,monospace" font-size="15">
    <text x="288" y="289" text-anchor="end" fill="#EAF2F8">Europe</text>
    <rect x="300" y="274" width="267" height="21" fill="#C42D1C"/>
    <text x="576.6666666666667" y="290" fill="#EE7A66">10</text>
  </g>
  <g font-family="'Space Mono',ui-monospace,monospace" font-size="15">
    <text x="288" y="351" text-anchor="end" fill="#EAF2F8">Americas</text>
    <rect x="300" y="336" width="53" height="21" fill="#FFEDA0"/>
    <text x="363.3333333333333" y="352" fill="#FFEDA0">2</text>
  </g>
  <text x="300" y="430" font-family="'Space Mono',ui-monospace,monospace" font-size="14" fill="#5E7891">Doubly landlocked: Liechtenstein, Uzbekistan</text>
  <text x="300" y="454" font-family="'Space Mono',ui-monospace,monospace" font-size="14" fill="#5E7891">Enclaves in the pool: Lesotho (South Africa), Eswatini (near-enclave)</text>
  <text x="50" y="524" font-family="'Space Mono',ui-monospace,monospace" font-size="13" fill="#5E7891">Our pool is 176 entries, not 195 UN states. Source: globleunlimited.net dataset.</text>
</svg>
