<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="fav-ocean" cx="38%" cy="34%" r="75%">
      <stop offset="0" stop-color="#2C9BE0"/>
      <stop offset="1" stop-color="#1463A0"/>
    </radialGradient>
    <clipPath id="fav-clip"><circle cx="32" cy="32" r="29"/></clipPath>
