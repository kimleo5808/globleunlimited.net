    <radialGradient id="c-halo" cx="50%" cy="50%" r="50%"><stop offset="0.58" stop-color="#F4C95D" stop-opacity="0"/><stop offset="0.85" stop-color="#F4C95D" stop-opacity=".3"/><stop offset="1" stop-color="#F4C95D" stop-opacity="0"/></radialGradient>
