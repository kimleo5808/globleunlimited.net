  <rect width="400" height="250" fill="url(#c-bg)"/>
  <g fill="#EAF2F8"><circle cx="44" cy="46" r="1.4" opacity=".6"/><circle cx="352" cy="58" r="1.1" opacity=".5"/><circle cx="66" cy="204" r="1.3" opacity=".55"/><circle cx="336" cy="198" r="1.4" opacity=".5"/></g>
