<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" font-family="'Space Mono', ui-monospace, monospace">
  <defs>
    <linearGradient id="f-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15304d"/><stop offset="1" stop-color="#0B1622"/></linearGradient>
    <clipPath id="f-frame"><rect x="110" y="65" width="180" height="120" rx="6"/></clipPath>
  </defs>
  <rect width="400" height="250" fill="url(#f-bg)"/>
  <g fill="#EAF2F8"><circle cx="52" cy="60" r="1.3" opacity=".5"/><circle cx="348" cy="70" r="1.1" opacity=".45"/><circle cx="64" cy="196" r="1.2" opacity=".5"/><circle cx="342" cy="192" r="1.2" opacity=".45"/></g>

  <!-- flag (vertical tricolour) behind the tiles -->
  <g clip-path="url(#f-frame)">
    <rect x="110" y="65" width="60" height="120" fill="#2E9E4F"/>
    <rect x="170" y="65" width="60" height="120" fill="#F4FAFE"/>
    <rect x="230" y="65" width="60" height="120" fill="#C42D1C"/>
    <!-- covered tiles: 3 of 6 hidden -->
    <g>
      <rect x="110" y="65" width="60" height="60" fill="#2C4B63"/>
      <rect x="230" y="65" width="60" height="60" fill="#2C4B63"/>
      <rect x="170" y="125" width="60" height="60" fill="#2C4B63"/>
    </g>
    <g fill="rgba(255,255,255,.4)" font-size="20" text-anchor="middle">
      <text x="140" y="102">?</text>
      <text x="260" y="102">?</text>
      <text x="200" y="162">?</text>
    </g>
    <!-- tile seams -->
    <g stroke="rgba(11,22,34,.35)" stroke-width="1">
      <line x1="170" y1="65" x2="170" y2="185"/><line x1="230" y1="65" x2="230" y2="185"/><line x1="110" y1="125" x2="290" y2="125"/>
    </g>
  </g>
  <rect x="110" y="65" width="180" height="120" rx="6" fill="none" stroke="rgba(244,201,93,.5)" stroke-width="2"/>
</svg>
