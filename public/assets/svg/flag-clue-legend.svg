<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="'Hanken Grotesk', system-ui, sans-serif">
  <defs>
    <linearGradient id="fl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13243A"/><stop offset="1" stop-color="#0B1622"/>
    </linearGradient>
    <marker id="fl-ah" markerWidth="9" markerHeight="9" refX="5.5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#F4C95D"/>
    </marker>
    <clipPath id="fl-clip"><rect x="40" y="96" width="210" height="140" rx="8"/></clipPath>
  </defs>

  <rect width="720" height="280" rx="14" fill="url(#fl-bg)"/>
  <text x="36" y="44" fill="#EAF2F8" font-size="22" font-family="'Fraunces', Georgia, serif" font-weight="600">Each wrong guess reveals one tile</text>
  <line x1="286" y1="78" x2="286" y2="244" stroke="#F4C95D" stroke-width="1" opacity=".18"/>
  <line x1="500" y1="78" x2="500" y2="244" stroke="#F4C95D" stroke-width="1" opacity=".18"/>

  <!-- ① Flag reveal grid (example: a simple tricolour) -->
  <g>
    <text x="40" y="88" fill="#F4C95D" font-size="13" letter-spacing=".08em">THE FLAG</text>
    <g clip-path="url(#fl-clip)">
      <rect x="40" y="96" width="70" height="140" fill="#2E9E4F"/>
      <rect x="110" y="96" width="70" height="140" fill="#F4FAFE"/>
      <rect x="180" y="96" width="70" height="140" fill="#C42D1C"/>
    </g>
    <!-- covering tiles, 3x2, fading out in sequence -->
    <g>
      <rect x="40"  y="96"  width="70" height="70" fill="#1B3350" stroke="#0B1622"><animate attributeName="opacity" values="1;0" dur="0.5s" begin="0.4s" fill="freeze"/></rect>
      <rect x="110" y="96"  width="70" height="70" fill="#1B3350" stroke="#0B1622"><animate attributeName="opacity" values="1;0" dur="0.5s" begin="1.0s" fill="freeze"/></rect>
      <rect x="180" y="96"  width="70" height="70" fill="#1B3350" stroke="#0B1622"/>
      <rect x="40"  y="166" width="70" height="70" fill="#1B3350" stroke="#0B1622"><animate attributeName="opacity" values="1;0" dur="0.5s" begin="1.6s" fill="freeze"/></rect>
      <rect x="110" y="166" width="70" height="70" fill="#1B3350" stroke="#0B1622"/>
      <rect x="180" y="166" width="70" height="70" fill="#1B3350" stroke="#0B1622"/>
    </g>
    <rect x="40" y="96" width="210" height="140" rx="8" fill="none" stroke="#F4C95D" stroke-opacity=".4"/>
  </g>

  <!-- ② Distance -->
  <g>
    <text x="306" y="120" fill="#F4C95D" font-size="13" letter-spacing=".08em">DISTANCE</text>
    <line x1="310" y1="160" x2="466" y2="160" stroke="#9DB2C6" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#fl-ah)">
      <animate attributeName="stroke-dashoffset" values="26;0" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <circle cx="310" cy="160" r="5" fill="#E8743B"/>
    <circle cx="466" cy="160" r="6" fill="#2E9E4F"/>
    <text x="388" y="196" fill="#EAF2F8" font-size="20" text-anchor="middle" font-family="'Space Mono', monospace">1,240 km</text>
  </g>

  <!-- ③ Direction -->
  <g>
    <text x="520" y="120" fill="#F4C95D" font-size="13" letter-spacing=".08em">DIRECTION</text>
    <circle cx="608" cy="168" r="40" fill="none" stroke="#9DB2C6" stroke-width="1.5" opacity=".5"/>
    <text x="608" y="138" fill="#9DB2C6" font-size="10" text-anchor="middle">N</text>
    <g>
      <line x1="608" y1="168" x2="608" y2="134" stroke="#F4C95D" stroke-width="3" stroke-linecap="round" marker-end="url(#fl-ah)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 608 168" to="135 608 168" dur="0.9s" fill="freeze" begin="0.3s"/>
    </g>
    <text x="608" y="230" fill="#9DB2C6" font-size="12" text-anchor="middle">which way to look</text>
  </g>
</svg>
