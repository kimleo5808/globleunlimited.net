<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="'Hanken Grotesk', system-ui, sans-serif">
  <defs>
    <linearGradient id="cl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13243A"/><stop offset="1" stop-color="#0B1622"/>
    </linearGradient>
    <marker id="cl-ah" markerWidth="9" markerHeight="9" refX="5.5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#F4C95D"/>
    </marker>
  </defs>

  <rect width="720" height="280" rx="14" fill="url(#cl-bg)"/>
  <text x="36" y="44" fill="#EAF2F8" font-size="22" font-family="'Fraunces', Georgia, serif" font-weight="600">Every guess gives you three clues</text>
  <line x1="256" y1="78" x2="256" y2="244" stroke="#F4C95D" stroke-width="1" opacity=".18"/>
  <line x1="480" y1="78" x2="480" y2="244" stroke="#F4C95D" stroke-width="1" opacity=".18"/>

  <!-- ① Distance -->
  <g>
    <text x="40" y="104" fill="#F4C95D" font-size="13" letter-spacing=".08em">DISTANCE</text>
    <line x1="44" y1="150" x2="212" y2="150" stroke="#9DB2C6" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#cl-ah)">
      <animate attributeName="stroke-dashoffset" values="26;0" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <circle cx="44" cy="150" r="5" fill="#E8743B"/>
    <circle cx="212" cy="150" r="6" fill="#2E9E4F"/>
    <text x="128" y="188" fill="#EAF2F8" font-size="22" text-anchor="middle" font-family="'Space Mono', monospace">1,240 km</text>
    <text x="128" y="212" fill="#9DB2C6" font-size="12" text-anchor="middle">how far your guess is</text>
  </g>

  <!-- ② Direction -->
  <g>
    <text x="276" y="104" fill="#F4C95D" font-size="13" letter-spacing=".08em">DIRECTION</text>
    <circle cx="368" cy="158" r="42" fill="none" stroke="#9DB2C6" stroke-width="1.5" opacity=".5"/>
    <text x="368" y="126" fill="#9DB2C6" font-size="10" text-anchor="middle">N</text>
    <text x="368" y="200" fill="#9DB2C6" font-size="10" text-anchor="middle">S</text>
    <g>
      <line x1="368" y1="158" x2="368" y2="122" stroke="#F4C95D" stroke-width="3" stroke-linecap="round" marker-end="url(#cl-ah)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 368 158" to="45 368 158" dur="0.9s" fill="freeze" begin="0.3s"/>
      <animateTransform attributeName="transform" type="rotate" values="45 368 158;40 368 158;45 368 158" dur="2.4s" begin="1.2s" repeatCount="indefinite" additive="sum"/>
    </g>
    <text x="368" y="228" fill="#9DB2C6" font-size="12" text-anchor="middle">which way to look</text>
  </g>

  <!-- ③ Proximity -->
  <g>
    <text x="500" y="104" fill="#F4C95D" font-size="13" letter-spacing=".08em">PROXIMITY</text>
    <g>
      <rect x="500" y="132" width="30" height="30" rx="5" fill="#2E9E4F"><animate attributeName="opacity" values=".25;1" dur="0.5s" begin="0.2s" fill="freeze"/></rect>
      <rect x="536" y="132" width="30" height="30" rx="5" fill="#2E9E4F"><animate attributeName="opacity" values=".25;1" dur="0.5s" begin="0.5s" fill="freeze"/></rect>
      <rect x="572" y="132" width="30" height="30" rx="5" fill="#FEB24C"><animate attributeName="opacity" values=".25;1" dur="0.5s" begin="0.8s" fill="freeze"/></rect>
      <rect x="608" y="132" width="30" height="30" rx="5" fill="#1B3350"/>
      <rect x="644" y="132" width="30" height="30" rx="5" fill="#1B3350"/>
    </g>
    <text x="587" y="196" fill="#EAF2F8" font-size="22" text-anchor="middle" font-family="'Space Mono', monospace">62%</text>
    <text x="587" y="220" fill="#9DB2C6" font-size="12" text-anchor="middle">how close you are</text>
  </g>
</svg>
