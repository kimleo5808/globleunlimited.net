<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Funnel chart: the four Globle hints cut the field from 176 countries to about 41 after the continent hint, 10 after the subregion hint, 7 after hemisphere and coastline, and 1 after the first letter and length.">
  <rect width="1000" height="560" fill="#0E1C2E"/>
  <rect x="16" y="16" width="968" height="528" fill="none" stroke="#F4C95D" stroke-opacity="0.3"/>
  <text x="50" y="62" font-family="Georgia,serif" font-size="27" fill="#EAF2F8">How far each hint narrows the field</text>
  <text x="50" y="90" font-family="'Space Mono',ui-monospace,monospace" font-size="15" fill="#5E7891">PLATE 1 · candidates remaining · mean across the answer archive</text>

  <!-- bar widths use a square-root scale so the last rungs stay legible -->
  <g font-family="'Space Mono',ui-monospace,monospace" font-size="15">

    <g>
      <text x="292" y="160" text-anchor="end" fill="#9DB2C6">Before any hint</text>
      <rect x="305" y="140" width="640" height="34" fill="#EAF2F8" fill-opacity="0.18"/>
      <text x="957" y="160" text-anchor="start" fill="#EAF2F8" font-size="17">176</text>
    </g>

    <g>
      <text x="292" y="235" text-anchor="end" fill="#EAF2F8">Hint 1 · Continent</text>
      <rect x="305" y="215" width="338" height="34" fill="#FFEDA0"/>
      <text x="655" y="235" fill="#FFEDA0" font-size="17">41</text>
    </g>

    <g>
      <text x="292" y="310" text-anchor="end" fill="#EAF2F8">Hint 2 · Subregion</text>
      <rect x="305" y="290" width="167" height="34" fill="#FEB24C"/>
      <text x="484" y="310" fill="#FEB24C" font-size="17">10</text>
    </g>

    <g>
      <text x="292" y="385" text-anchor="end" fill="#EAF2F8">Hint 3 · Hemisphere + coast</text>
      <rect x="305" y="365" width="140" height="34" fill="#E8743B"/>
      <text x="457" y="385" fill="#E8743B" font-size="17">7</text>
    </g>

    <g>
      <text x="292" y="460" text-anchor="end" fill="#EAF2F8">Hint 4 · First letter + length</text>
      <rect x="305" y="440" width="53" height="34" fill="#C42D1C"/>
      <text x="370" y="460" fill="#C42D1C" font-size="17">1</text>
    </g>
  </g>

  <!-- bracket spanning the two rungs that do the real work -->
  <path d="M690 218 h34 v106 h-34" fill="none" stroke="#F4C95D" stroke-opacity="0.4"/>
  <text x="736" y="266" font-family="'Space Mono',ui-monospace,monospace" font-size="14" fill="#F4C95D">the first two rungs</text>
  <text x="736" y="286" font-family="'Space Mono',ui-monospace,monospace" font-size="14" fill="#F4C95D">remove 94% of the field</text>

  <text x="50" y="520" font-family="'Space Mono',ui-monospace,monospace" font-size="13" fill="#5E7891">Bar length uses a square-root scale. globleunlimited.net</text>
</svg>
