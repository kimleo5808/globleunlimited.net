<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Diverging bar chart of trap pairs: Greenland is 14.7 times bigger than Bangladesh with 3053.7 times fewer people; Mongolia is 149.6 times bigger than Lebanon with 1.6 times fewer people; Australia is 76.8 times bigger than South Korea with 1.9 times fewer people; Canada is 3.0 times bigger than India with 35.2 times fewer people; Libya is 66.8 times bigger than Rwanda with 1.9 times fewer people; Botswana is 20.9 times bigger than Burundi with 5.6 times fewer people">
