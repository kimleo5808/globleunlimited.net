    <text x="288" y="139" text-anchor="end" fill="#EAF2F8">North America</text>
    <rect x="300" y="124" width="336" height="21" fill="#2E9E4F"/>
    <text x="646" y="140" fill="#9DB2C6">8 of 23</text>
  </g>
  <g font-family="'Space Mono',ui-monospace,monospace" font-size="15">
    <text x="288" y="179" text-anchor="end" fill="#EAF2F8">Oceania</text>
    <rect x="300" y="164" width="336" height="21" fill="#C39BD3"/>
    <text x="646" y="180" fill="#9DB2C6">8 of 14</text>
  </g>
  <g font-family="'Space Mono',ui-monospace,monospace" font-size="15">
    <text x="288" y="219" text-anchor="end" fill="#EAF2F8">Europe</text>
    <rect x="300" y="204" width="294" height="21" fill="#7FB3D5"/>
    <text x="604" y="220" fill="#9DB2C6">7 of 44</text>
  </g>
  <g font-family="'Space Mono',ui-monospace,monospace" font-size="15">
    <text x="288" y="259" text-anchor="end" fill="#EAF2F8">Africa</text>
    <rect x="300" y="244" width="210" height="21" fill="#E8743B"/>
