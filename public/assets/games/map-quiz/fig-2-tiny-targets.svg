  <text x="50" y="396" font-family="'Space Mono',ui-monospace,monospace" font-size="13" fill="#F4C95D">SMALLEST IN EACH QUIZ</text>
  <text x="50" y="426" font-family="'Space Mono',ui-monospace,monospace" font-size="13" fill="#EAF2F8">Seychelles (452 km²)</text><text x="350" y="426" font-family="'Space Mono',ui-monospace,monospace" font-size="13" fill="#EAF2F8">Maldives (300 km²)</text><text x="650" y="426" font-family="'Space Mono',ui-monospace,monospace" font-size="13" fill="#EAF2F8">Monaco (2.0 km²)</text><text x="50" y="452" font-family="'Space Mono',ui-monospace,monospace" font-size="13" fill="#EAF2F8">Saint Kitts and Nevis (261 km²)</text><text x="350" y="452" font-family="'Space Mono',ui-monospace,monospace" font-size="13" fill="#EAF2F8">Nauru (21 km²)</text><text x="650" y="452" font-family="'Space Mono',ui-monospace,monospace" font-size="13" fill="#EAF2F8">Suriname (163,820 km²)</text>
  <text x="50" y="524" font-family="'Space Mono',ui-monospace,monospace" font-size="13" fill="#5E7891">Area: world-countries · UN members only (Vatican City counted as an observer) · globleunlimited.net</text>
