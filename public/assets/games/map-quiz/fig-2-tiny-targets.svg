<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Bar chart of small member states per region: North America 8 of 23, Oceania 8 of 14, Europe 7 of 44, Africa 5 of 54, Asia 4 of 46, South America 0 of 12">
  <rect width="1000" height="560" fill="#0E1C2E"/>
  <rect x="16" y="16" width="968" height="528" fill="none" stroke="#F4C95D" stroke-opacity="0.3"/>
  <text x="50" y="62" font-family="Georgia,'Times New Roman',serif" font-size="27" fill="#EAF2F8">32 member states are smaller than 10,000 km²</text>
  <text x="50" y="90" font-family="'Space Mono',ui-monospace,monospace" font-size="15" fill="#5E7891">per quiz: members under 10,000 km², the ones a fingertip can miss</text>
